# SPDX-License-Identifier: MIT
#
# cec-crucible — CEC's in-house PC-build stress/validation suite.
# Zero external dependencies by design (std only); see docs/design.md.

[workspace]
resolver = "2"
members = [
    "crates/crucible-core",
    "crates/crucible-cpu",
    "crates/crucible-mem",
    "crates/crucible-storage",
    "crates/crucible-gpu",
    "crates/crucible-cli",
]

# `cargo build` / `cargo test` at the root operate on these only. crucible-gpu
# is a member (so it ships inside the single `cec-crucible` binary) but is left
# out here, so the everyday workflow never compiles its external dependency
# tree and the core stays offline-buildable with zero dependencies.
#
# Full GPU-enabled binary:
#   cargo build --release -p crucible-cli --features gpu
default-members = [
    "crates/crucible-core",
    "crates/crucible-cpu",
    "crates/crucible-mem",
    "crates/crucible-storage",
    "crates/crucible-cli",
]

# Throwaway spikes are excluded entirely — they are reference code, not part of
# the product. See spikes/gpu-3a/README.md.
exclude = ["spikes/*"]

[workspace.package]
version = "0.0.6"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["Computer Exchange Corner (CEC)"]
repository = "https://github.com/cec/cec-crucible"
description = "CEC in-house PC-build stress/validation suite (CPU/RAM/storage; GPU planned)"

# A single release profile tuned for the shipped stress binary: maximum
# optimization so the load kernels actually saturate the hardware. `cargo test`
# uses the (fast, unwinding) test profile and is unaffected by these settings.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
