# SPDX-License-Identifier: MIT
[package]
name = "crucible-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "cec-crucible orchestrator CLI: per-domain kernels, profiles, device-ID'd reports"

[[bin]]
name = "cec-crucible"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[features]
# Off by default so the standard build stays zero-dependency and offline-
# buildable. Turn on for the full shipped binary:
#   cargo build --release -p crucible-cli --features gpu
gpu = ["dep:crucible-gpu"]
# Adds the CUDA transfer path for the PCIe link test (NVIDIA, driver-only, no
# CUDA toolkit needed). Implies gpu.
#   cargo build --release -p crucible-cli --features cuda
cuda = ["gpu", "crucible-gpu/cuda"]
# Tensor-core (cooperative-matrix) test — pulls CubeCL's Vulkan/SPIR-V backend.
#   cargo build --release -p crucible-cli --features tensor
tensor = ["gpu", "crucible-gpu/tensor"]
# glTF/PBR scene rendering for the `render` kernel (`--scene <file>`).
#   cargo build --release -p crucible-cli --features gpu-gltf
gpu-gltf = ["gpu", "crucible-gpu/gpu-gltf"]
# Ray-tracing-core (ray-query) test — raw Vulkan, portable single binary. The
# shader is compiled from WGSL to SPIR-V at runtime (naga), so no shader compiler
# is needed on the build or target machine. Implies gpu.
#   cargo build --release -p crucible-cli --features rt
rt = ["gpu", "crucible-gpu/rt"]
# OptiX NVIDIA-native path tracer (RT + SM). Driver-resident, NVIDIA-only.
#   CUDARC_CUDA_VERSION=13030 cargo build --release -p crucible-cli --features optix
optix = ["gpu", "crucible-gpu/optix"]
# Live-preview window for `render --preview` (Windows-only). Implies gpu.
#   cargo build --release -p crucible-cli --features preview
preview = ["gpu", "crucible-gpu/preview"]
# Opt-in live terminal UI (`--ui`), built on crossterm. Off by default so the
# standard build stays zero-dependency and scriptable for the harness.
#   cargo build --release -p crucible-cli --features gpu,tui
tui = ["dep:crossterm"]

[dependencies]
crucible-core = { path = "../crucible-core" }
crucible-cpu = { path = "../crucible-cpu" }
crucible-mem = { path = "../crucible-mem" }
crucible-storage = { path = "../crucible-storage" }
crucible-gpu = { path = "../crucible-gpu", optional = true }
crossterm = { version = "0.28", optional = true }
