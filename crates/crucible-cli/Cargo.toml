# SPDX-License-Identifier: MIT
[package]
name = "crucible-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "cec-crucible orchestrator CLI: per-domain kernels, profiles, device-ID'd reports"

[[bin]]
name = "cec-crucible"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[dependencies]
crucible-core = { path = "../crucible-core" }
crucible-cpu = { path = "../crucible-cpu" }
crucible-mem = { path = "../crucible-mem" }
crucible-storage = { path = "../crucible-storage" }
