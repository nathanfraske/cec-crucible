# SPDX-License-Identifier: MIT
[package]
name = "crucible-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "cec-crucible orchestrator CLI: per-domain kernels, profiles, device-ID'd reports"

[[bin]]
name = "cec-crucible"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[features]
# Off by default so the standard build stays zero-dependency and offline-
# buildable. Turn on for the full shipped binary:
#   cargo build --release -p crucible-cli --features gpu
gpu = ["dep:crucible-gpu"]
# Adds the CUDA transfer path for the PCIe link test (NVIDIA, driver-only, no
# CUDA toolkit needed). Implies gpu.
#   cargo build --release -p crucible-cli --features cuda
cuda = ["gpu", "crucible-gpu/cuda"]
# Opt-in live terminal UI (`--ui`), built on crossterm. Off by default so the
# standard build stays zero-dependency and scriptable for the harness.
#   cargo build --release -p crucible-cli --features gpu,tui
tui = ["dep:crossterm"]

[dependencies]
crucible-core = { path = "../crucible-core" }
crucible-cpu = { path = "../crucible-cpu" }
crucible-mem = { path = "../crucible-mem" }
crucible-storage = { path = "../crucible-storage" }
crucible-gpu = { path = "../crucible-gpu", optional = true }
crossterm = { version = "0.28", optional = true }
