# SPDX-License-Identifier: MIT
#
# This is the one crate in the suite permitted external dependencies (CubeCL).
# It IS a workspace member so it ships inside the single `cec-crucible` binary,
# but it is kept out of `default-members` (see the root Cargo.toml) so the
# everyday `cargo build` / `cargo test` never compiles this dependency tree.
#
# Build the full, GPU-enabled binary with:
#   cargo build --release -p crucible-cli --features gpu
[package]
name = "crucible-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPU load kernel for cec-crucible: CubeCL thrasher with load shapes, markers and per-dispatch verification"

[dependencies]
crucible-core = { path = "../crucible-core" }
cubecl = { version = "0.10", features = ["wgpu"] }
wgpu = { version = "29", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
# cudarc drives the CUDA *transfer* path for the PCIe link test (pinned host
# memory + multiple streams = true full-duplex on the GPU's copy engines).
# Unlike the CubeCL CUDA compute runtime, a transfer-only workload never touches
# NVRTC, so this path runs on a machine with the driver but no CUDA toolkit.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "driver",
    "std",
    "cuda-version-from-build-system",
    "fallback-dynamic-loading",
] }
# f16 host type for the tensor (cmma) kernel; only pulled with `tensor`.
half = { version = "2.5", optional = true, default-features = false }
# glTF scene loading for the render kernel; only pulled with `gpu-gltf`. `import`
# brings resource loading + the `image` crate already trimmed to png+jpeg.
gltf = { version = "1.4", optional = true, default-features = false, features = [
    "import",
    "utils",
] }
# RT-core (ray-query) test. Raw Vulkan (ash) is the only portable, single-binary
# path to hardware ray traversal — wgpu's ray-query is experimental/Vulkan-only,
# OptiX is NVIDIA-only. Pinned to 0.38 (the ABI cubecl-spirv already links, so no
# duplicate ash in the tree). gpu-allocator handles device memory + the
# device-address allocate flag the acceleration structures require. naga (already
# in the wgpu tree) compiles the WGSL ray-query shader to SPIR-V at runtime, so no
# external shader compiler is needed. All three are pulled ONLY with `rt`.
ash = { version = "=0.38.0", optional = true, default-features = false, features = [
    "std",
    "loaded",
] }
gpu-allocator = { version = "0.28", optional = true, default-features = false, features = [
    "vulkan",
    "std",
] }
naga = { version = "=29.0.4", optional = true, features = ["wgsl-in", "spv-out"] }
# Live-preview window for the `render` kernel. Only `raw-window-handle` (already
# in the wgpu tree) is needed — the window itself is hand-rolled Win32 FFI, no
# winit. Pulled ONLY with `preview`.
raw-window-handle = { version = "0.6", optional = true }

[features]
# CUDA compute (the thrasher via CubeCL's CUDA runtime) needs NVRTC at runtime;
# the cudarc transfer path (link test) does not. Both are gated here.
cuda = ["cubecl/cuda", "dep:cudarc"]
# Tensor-core test: enables CubeCL's Vulkan/SPIR-V backend (adds ash +
# cubecl-spirv) so cooperative-matrix (cmma) maps to the tensor cores — the wgsl
# backend cannot do mma. Proven f16->f32 bit-exact on the RTX 3070.
tensor = ["cubecl/vulkan", "dep:half"]
# glTF/PBR scene rendering for the `render` kernel (bundled or --scene).
gpu-gltf = ["dep:gltf"]
# RT-core (ray-query) test via raw Vulkan. Portable, single-binary hardware ray
# traversal; the shader is compiled from WGSL to SPIR-V at runtime by naga, so no
# shader compiler is required on the build or target machine.
#   cargo build --release -p crucible-cli --features rt
rt = ["dep:ash", "dep:gpu-allocator", "dep:naga"]
# Live-preview window for the `render` kernel (`render --preview`). Windows-only
# (hand-rolled Win32 window); mirrors the offscreen frame to a swapchain, so the
# verified bytes are unchanged from a headless run.
preview = ["dep:raw-window-handle"]
